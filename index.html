<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>雀卓 — 正式規則單機立直麻將</title>
<style>
:root{
  --felt-dark:#0d2b22;
  --felt:#123b2e;
  --felt-light:#1a4d3b;
  --gold:#c9a86a;
  --gold-bright:#e2c584;
  --wood:#3a2418;
  --wood-light:#5a3a26;
  --cream:#f2ead9;
  --ink:#1b1611;
  --red:#a83232;
  --paper:#efe6d0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK TC","PMingLiU",serif;
  background:radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt) 55%, var(--felt-dark) 100%);
  color:var(--cream);
  min-height:100vh;
}
#app{max-width:1160px;margin:0 auto;padding:14px 14px 40px;}
h1.title{text-align:center;font-size:24px;letter-spacing:.4em;color:var(--gold-bright);margin:0;text-shadow:0 0 18px rgba(226,197,132,.35);font-weight:600;}
.title-row{position:relative;display:flex;align-items:center;justify-content:center;margin:6px 0 10px;}
#settingsGearBtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.3);border:1px solid rgba(201,168,106,.4);border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--gold-bright);transition:filter .15s;}
#settingsGearBtn:hover{filter:brightness(1.3);}
.subtitle{text-align:center;font-size:12px;color:var(--gold);letter-spacing:.3em;margin-bottom:14px;font-family:sans-serif;}
.audio-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;font-family:sans-serif;flex-wrap:wrap;}
.settings-row{display:flex;align-items:center;justify-content:center;gap:10px;font-family:sans-serif;flex-wrap:wrap;margin:12px 0;}
.audio-btn{background:rgba(0,0,0,.3);color:var(--gold-bright);border:1px solid rgba(201,168,106,.4);border-radius:16px;padding:5px 14px;font-size:12.5px;cursor:pointer;transition:filter .15s;}
.audio-btn:hover{filter:brightness(1.2);}
.audio-btn.off{opacity:.5;}
.diff-btn.active{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#2a1c0d;border-color:var(--gold-bright);}
#musicVolume{accent-color:var(--gold-bright);width:100px;}
.table-frame{background:linear-gradient(135deg, var(--wood-light), var(--wood) 60%);border-radius:16px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 0 2px rgba(201,168,106,.25);}
.table-felt{background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.05), transparent 65%),var(--felt);border-radius:12px;padding:8px;position:relative;box-shadow:inset 0 0 60px rgba(0,0,0,.5);}

/* ---- 環形對局桌 ---- */
.ring{
  display:grid;
  grid-template-columns: 1fr 1.7fr 1fr;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "cornerA top cornerB"
    "left center right"
    "cornerC bottom cornerD";
  gap:6px;
  min-height:400px;
}
.seat{background:rgba(0,0,0,.18);border:1px solid rgba(201,168,106,.22);border-radius:10px;padding:6px 9px;overflow:visible;}
.seat.active-turn{border-color:var(--gold-bright);box-shadow:0 0 14px rgba(226,197,132,.4);}
.seat-top{grid-area:top;}
.seat-left{grid-area:left;}
.seat-right{grid-area:right;}
.seat-bottom{grid-area:bottom;}
.seat-head{display:flex;align-items:center;font-family:sans-serif;font-size:13.5px;color:var(--gold-bright);margin-bottom:4px;gap:7px;font-weight:600;}
.seat-head .name-block{display:flex;flex-direction:column;gap:1px;}
.seat-head .tags{display:flex;gap:5px;align-items:center;}
.seat-head .riichi-mark{color:var(--red);font-weight:bold;}
.seat-head .pao-mark{color:#ff8a4c;font-weight:bold;}
.seat-score{font-family:'Courier New',monospace;font-weight:700;font-size:13px;padding:1px 7px;border-radius:4px;background:#0a0a0a;box-shadow:inset 0 0 4px rgba(0,0,0,.8);}
.seat-score.dealer-led{box-shadow:inset 0 0 4px rgba(0,0,0,.8), 0 0 6px rgba(255,90,90,.6);}
.led-0{color:#4dd9ff;} .led-1{color:#ffce54;} .led-2{color:#ff7676;} .led-3{color:#79e08c;}
.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.4);}
.avatar.dealer-avatar{border-color:var(--gold-bright);box-shadow:0 0 10px rgba(226,197,132,.7);}
.avatar-0{background:linear-gradient(150deg,#4dc9ff,#1b7fae);}
.avatar-1{background:linear-gradient(150deg,#ffcf59,#c98d1e);}
.avatar-2{background:linear-gradient(150deg,#ff8a8a,#b8393f);}
.avatar-3{background:linear-gradient(150deg,#8fe0a0,#2e8f4d);}
.seat-pond{display:flex;flex-wrap:wrap;gap:3px;min-height:26px;max-height:110px;overflow-y:auto;padding:2px;}
.seat-pond-label,.seat-melds-label{font-family:sans-serif;font-size:10px;color:#8fa89a;letter-spacing:.1em;margin:5px 0 2px;}
.seat-melds{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px;margin-bottom:4px;border-bottom:1px dashed rgba(201,168,106,.4);}
.meld-group{display:flex;gap:1px;background:linear-gradient(160deg,rgba(201,168,106,.22),rgba(201,168,106,.08));padding:3px;border-radius:5px;border:1.5px solid rgba(201,168,106,.55);}
.tile-mini2{font-size:25px;background:var(--paper);color:var(--ink);border-radius:4px;padding:2px 3px;line-height:1.2;box-shadow:0 2px 3px rgba(0,0,0,.35);}
.tile-mini2.honor{color:var(--red);}
.tile-mini2.called-rot{transform:rotate(90deg);margin:0 3px;}

.diamond-deco{position:absolute; left:50%; top:50%; width:min(56%,420px); height:min(56%,420px); transform:translate(-50%,-50%) rotate(45deg); border:2px dashed rgba(201,168,106,.3); border-radius:12px; pointer-events:none; z-index:0;}
.ring{position:relative; z-index:1;}

.center-info{grid-area:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(160deg,#1a1a1a,#0c0c0c);border-radius:14px;border:2px solid rgba(201,168,106,.4);padding:10px 12px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 0 20px rgba(0,0,0,.6);}
.center-round{font-size:19px;color:var(--gold-bright);letter-spacing:.12em;font-family:sans-serif;font-weight:700;}
.center-wall{font-family:sans-serif;font-size:12px;color:#bcd6c8;display:flex;align-items:center;gap:6px;}
.wall-strip{display:flex;gap:1px;flex-wrap:wrap;max-width:150px;}
.wall-tile-back{width:6px;height:12px;border-radius:1px;background:linear-gradient(160deg,#3a6b52,#1e4433);border:1px solid rgba(201,168,106,.35);}
.dora-box{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;}
.dora-box .tile-mini{font-size:21px;background:var(--paper);color:var(--ink);border-radius:4px;padding:1px 4px;box-shadow:0 2px 3px rgba(0,0,0,.4);}

.log-panel-inline{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(201,168,106,.2);border-radius:8px;padding:6px 9px;font-family:sans-serif;font-size:12.5px;color:#e6efe9;max-height:76px;overflow-y:auto;line-height:1.6;flex-shrink:0;}
.log-panel-inline .win-line{color:var(--gold-bright);font-weight:bold;}
.log-panel-inline .log-tile{font-size:17px;vertical-align:middle;}

/* human interactive panel */
.human-area{background:rgba(0,0,0,.18);border:1px solid rgba(201,168,106,.3);border-radius:10px;padding:10px;}
.human-head{display:flex;justify-content:space-between;align-items:center;font-family:sans-serif;font-size:15px;color:var(--gold-bright);margin-bottom:8px;font-weight:600;}
.human-melds{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;min-height:1px;}
.human-hand{display:flex;gap:3px;flex-wrap:wrap;min-height:64px;align-items:flex-end;}
.tile{font-size:36px;width:38px;height:54px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fbf6e8,var(--paper));color:var(--ink);border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.35), 0 4px 6px rgba(0,0,0,.3);cursor:pointer;user-select:none;transition:transform .12s ease;border:1px solid rgba(0,0,0,.15);}
.tile:hover{transform:translateY(-8px);}
.tile.drawn{margin-left:22px;border:1px solid var(--gold-bright);position:relative;}
.tile.drawn::before{content:'';position:absolute;left:-13px;top:-4px;bottom:-4px;width:1px;background:rgba(201,168,106,.4);}
.tile.disabled{cursor:default;opacity:.55;}
.tile.disabled:hover{transform:none;}
.tile.honor{color:var(--red);}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-family:sans-serif;}
button.act{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#2a1c0d;border:none;border-radius:20px;padding:9px 20px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4);letter-spacing:.05em;transition:filter .15s, transform .1s;}
button.act:hover{filter:brightness(1.08);transform:translateY(-1px);}
button.act:active{transform:translateY(1px);}
button.act.secondary{background:rgba(0,0,0,.25);color:var(--gold-bright);border:1px solid var(--gold);}
button.act.danger{background:linear-gradient(180deg,#c65b4a,#a83232);color:#fff2ec;}

.rules-toggle{text-align:center;margin-top:12px;font-family:sans-serif;font-size:12px;}
.rules-toggle a{color:var(--gold);cursor:pointer;text-decoration:underline;}
#rulesPanel{display:none;font-family:sans-serif;font-size:12.5px;background:rgba(0,0,0,.3);border:1px solid rgba(201,168,106,.3);border-radius:8px;padding:14px 16px;margin-top:8px;line-height:1.8;color:#e8ddc4;}
#rulesPanel h3{color:var(--gold-bright);margin:8px 0 4px;font-size:13.5px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:linear-gradient(160deg,#1c4635,var(--felt-dark));border:2px solid var(--gold);border-radius:14px;padding:22px 26px;max-width:540px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal h2{color:var(--gold-bright);text-align:center;margin:0 0 12px;letter-spacing:.12em;font-size:19px;}
.modal .yaku-list{font-family:sans-serif;font-size:15px;margin:10px 0;color:#f0e6c8;}
.modal .yaku-list div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed rgba(201,168,106,.15);}
.modal .big-total{text-align:center;font-family:sans-serif;font-size:20px;color:var(--gold-bright);margin:10px 0;font-weight:bold;}
.modal .hand-display{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
.modal-actions{text-align:center;margin-top:16px;}
.pao-note{color:#ff8a4c;text-align:center;font-family:sans-serif;font-size:12.5px;margin-top:4px;}
.reaction-modal{max-width:420px;}
.reaction-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
button.reaction-btn{font-size:18px;padding:14px 24px;min-width:80px;}
button.chi-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 18px;}
button.chi-btn .chi-tiles{font-size:34px;line-height:1;}
button.chi-btn .chi-labels{font-size:12px;color:#5a4423;font-family:sans-serif;letter-spacing:.05em;}

.reaction-float{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:90;
  background:linear-gradient(160deg,#1c4635,var(--felt-dark));
  border:2px solid var(--gold); border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
  width:300px; max-width:90vw;
  padding:10px 14px 14px;
}
.reaction-float-header{
  display:flex; justify-content:space-between; align-items:center;
  cursor:grab; user-select:none; touch-action:none;
  color:var(--gold-bright); font-weight:600; font-size:14px; font-family:sans-serif;
  padding-bottom:8px; margin-bottom:4px; border-bottom:1px solid rgba(201,168,106,.3);
}
.reaction-float-header:active{cursor:grabbing;}
.reaction-min-btn{background:none;border:1px solid rgba(201,168,106,.4);border-radius:6px;color:var(--gold-bright);width:24px;height:24px;font-size:14px;cursor:pointer;line-height:1;}
.reaction-float.minimized{padding-bottom:10px;}
.reaction-float.minimized .reaction-body{display:none;}
.reaction-float.minimized .reaction-float-header{border-bottom:none;margin-bottom:0;padding-bottom:0;}

.final-modal{animation:finalPop .4s ease-out;}
@keyframes finalPop{ from{transform:scale(.85);opacity:0;} to{transform:scale(1);opacity:1;} }
.final-rank-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.final-rank-row{display:flex;align-items:center;gap:12px;font-family:sans-serif;background:rgba(0,0,0,.25);border-radius:10px;padding:10px 14px;border:1px solid rgba(201,168,106,.2);}
.final-rank-row.final-first{background:linear-gradient(90deg,rgba(226,197,132,.25),rgba(226,197,132,.05));border:1px solid var(--gold-bright);box-shadow:0 0 14px rgba(226,197,132,.35);}
.final-medal{font-size:26px;}
.final-name{flex:1;color:var(--cream);font-size:15px;font-weight:600;}
.final-score{font-family:'Courier New',monospace;font-size:17px;font-weight:700;color:var(--gold-bright);}

/* 自摸特效 */
.tsumo-flash-overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.tsumo-flash-burst{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle, rgba(226,197,132,.9), rgba(226,197,132,0) 70%);animation:tsumoBurst .9s ease-out forwards;}
@keyframes tsumoBurst{ from{transform:scale(.2);opacity:1;} to{transform:scale(9);opacity:0;} }
.tsumo-flash-text{position:relative;font-family:"Yu Mincho","Noto Serif CJK TC",serif;font-size:56px;font-weight:900;color:var(--gold-bright);letter-spacing:.2em;text-shadow:0 0 20px rgba(226,197,132,.9), 0 4px 10px rgba(0,0,0,.6);animation:tsumoText 1.1s ease-out forwards;}
@keyframes tsumoText{
  0%{transform:scale(.3) rotate(-8deg);opacity:0;}
  25%{transform:scale(1.15) rotate(2deg);opacity:1;}
  40%{transform:scale(1) rotate(0deg);opacity:1;}
  80%{transform:scale(1) rotate(0deg);opacity:1;}
  100%{transform:scale(1.3) rotate(0deg);opacity:0;}
}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:rgba(201,168,106,.4);border-radius:4px;}

@media(max-width:760px){
  #app{padding:8px 6px 30px;}
  .ring{grid-template-columns:1fr; grid-template-rows:auto; grid-template-areas:"top" "center" "left" "right" "bottom"; min-height:auto;}
  .tile{width:30px;height:46px;font-size:28px;}
  h1.title{font-size:18px;letter-spacing:.25em;}
  .tile-mini2{font-size:20px;padding:1px 2px;}
  .seat-pond{max-height:110px;}
  button.reaction-btn{font-size:15px;padding:10px 16px;min-width:64px;}
}
@media(max-width:480px){
  #app{padding:6px 4px 26px;}
  .tile{width:24px;height:38px;font-size:22px;}
  .tile-mini2{font-size:16px;}
  h1.title{font-size:15px;letter-spacing:.15em;}
  .avatar{width:30px;height:30px;min-width:30px;font-size:13px;}
  .modal{padding:14px 12px;}
}
</style>
</head>
<body>
<div id="app">
  <div class="title-row">
    <h1 class="title">麻 雀 王</h1>
    <button id="settingsGearBtn" title="設定" onclick="openSettingsModal()">⚙️</button>
  </div>

  <div class="table-frame">
    <div class="table-felt">
      <div class="diamond-deco"></div>
      <div class="ring">
        <div class="seat seat-top" id="seatTop"></div>
        <div class="seat seat-left" id="seatLeft"></div>
        <div class="center-info" id="centerInfo">
          <div id="centerInfoTop"></div>
          <div class="log-panel-inline" id="centerLog"></div>
        </div>
        <div class="seat seat-right" id="seatRight"></div>
        <div class="seat seat-bottom" id="seatBottom"></div>
      </div>
    </div>
  </div>

  <div class="table-frame">
    <div class="table-felt">
      <div class="human-area">
        <div class="human-head" id="humanHead"></div>
        <button class="audio-btn" id="analyzeBtn" style="margin-bottom:6px;" onclick="analyzeTenpai()">🔍 聽牌分析（除錯用）</button>
        <button class="audio-btn" id="yakuListBtn" style="margin-bottom:6px;" onclick="showYakuListModal()">📖 役種表</button>
        <div class="human-melds" id="humanMelds"></div>
        <div class="human-hand" id="humanHand"></div>
        <div class="actions" id="actions"></div>
      </div>
    </div>
  </div>

  <div class="rules-toggle"><a id="rulesLink">關於本遊戲的規則涵蓋範圍</a></div>
  <div id="rulesPanel"></div>
</div>

<div id="modalRoot"></div>

<script>
/* ========================================================================
   基本常數與工具
======================================================================== */
const TILE_UNICODE = {
  m: ['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏'],
  p: ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'],
  s: ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'],
  z: ['🀀','🀁','🀂','🀃','🀆','🀅','🀄'] // 1東 2南 3西 4北 5白 6發 7中
};
const HONOR_NAME = {1:'東',2:'南',3:'西',4:'北',5:'白',6:'發',7:'中'};
// ---- 背景音樂(base64內嵌，Suno生成) ----
const MUSIC_TRACKS = [
  "MJ_chill.mp3",
  "MJ_chill_2.mp3"
];
const RIICHI_TRACK = "Riichi.mp3";

const VICTORY_TRACK = "victory.mp3";
const WIND_NAME = {1:'東',2:'南',3:'西',4:'北'};
const SUIT_ORDER = {m:0,p:1,s:2,z:3};

/* ========================================================================
   音效與音樂引擎
======================================================================== */
const AudioSys = {
  sfxOn: true,
  musicOn: true,
  musicVolume: 0.35,
  musicStarted: false,
  actx: null,
  musicEl: null,
  trackIdx: -1,
  mood: 'chill',

  ensureCtx(){
    if(!this.actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) this.actx = new AC();
    }
    if(this.actx && this.actx.state==='suspended') this.actx.resume();
    return this.actx;
  },

  // 使用者第一次互動時呼叫，解除瀏覽器自動播放限制
  unlock(){
    this.ensureCtx();
    if(!this.musicEl){
      this.musicEl = new Audio();
      this.musicEl.volume = this.musicVolume;
      this.musicEl.addEventListener('ended', ()=> this.playNextTrack());
    }
    if(!this.musicStarted){
      this.musicStarted = true;
      if(this.musicOn) this.playNextTrack();
    }
  },
  playNextTrack(){
    if(!this.musicEl || MUSIC_TRACKS.length===0) return;
    this.trackIdx = (this.trackIdx+1) % MUSIC_TRACKS.length;
    this.musicEl.src = MUSIC_TRACKS[this.trackIdx];
    if(this.musicOn) this.musicEl.play().catch(()=>{});
  },
  toggleMusic(){
    this.musicOn = !this.musicOn;
    if(!this.musicEl) return this.musicOn;
    if(this.musicOn){
      if(!this.musicEl.src) this.playNextTrack();
      else this.musicEl.play().catch(()=>{});
    } else {
      this.musicEl.pause();
    }
    return this.musicOn;
  },
  setVolume(v){
    this.musicVolume = v;
    if(this.musicEl) this.musicEl.volume = v;
  },
  toggleSfx(){ this.sfxOn = !this.sfxOn; return this.sfxOn; },

  // 記錄「切到背景前音樂是否原本在播放」，回到前景時才恢復
  _wasPlayingBeforeHide: false,
  pauseForBackground(){
    if(!this.musicEl) return;
    this._wasPlayingBeforeHide = this.musicOn && !this.musicEl.paused;
    if(this._wasPlayingBeforeHide) this.musicEl.pause();
  },
  resumeFromBackground(){
    if(!this.musicEl) return;
    if(this._wasPlayingBeforeHide && this.musicOn) this.musicEl.play().catch(()=>{});
  },

  // 若桌上有人正在立直，切換成緊張配樂(循環播放)；沒人立直時恢復平常兩首輪播
  updateMood(){
    if(!this.musicStarted || !this.musicEl) return;
    const anyRiichi = (typeof G!=='undefined' && G && G.players) ? G.players.some(p=>p.riichi) : false;
    if(anyRiichi && this.mood!=='riichi'){
      this.mood='riichi';
      this.musicEl.loop = true;
      this.musicEl.src = RIICHI_TRACK;
      if(this.musicOn) this.musicEl.play().catch(()=>{});
    } else if(!anyRiichi && this.mood==='riichi'){
      this.mood='chill';
      this.musicEl.loop = false;
      this.playNextTrack();
    }
  },

  // 胡牌時切成勝利音樂；若播到快結束(倒數4秒)還沒進下一局，自動淡出接回輪播
  victoryFadeTimer: null,
  playVictory(){
    if(!this.musicEl) return;
    clearTimeout(this.victoryFadeTimer);
    this.mood='victory';
    this.musicEl.loop = false;
    this.musicEl.volume = this.musicVolume;
    this.musicEl.src = VICTORY_TRACK;
    if(this.musicOn) this.musicEl.play().catch(()=>{});
    // 假設音樂約49秒，倒數4秒時開始自然淡出(若這時使用者還沒按下一局)
    this.victoryFadeTimer = setTimeout(()=>{
      if(this.mood==='victory') this.fadeOutAndResume(4);
    }, 45000);
  },
  // 提前結束勝利音樂(例如使用者按下一局)，用較短的淡出時間接回平常輪播
  fadeOutAndResume(durationSec){
    if(!this.musicEl){ this.mood='chill'; return; }
    clearTimeout(this.victoryFadeTimer);
    if(this.mood!=='victory'){ return; }
    this.mood='fading';
    const el = this.musicEl;
    const startVol = el.volume || this.musicVolume;
    const steps = 20;
    const stepTime = Math.max(20, (durationSec*1000)/steps);
    let i = 0;
    const iv = setInterval(()=>{
      i++;
      el.volume = Math.max(0, startVol*(1 - i/steps));
      if(i>=steps){
        clearInterval(iv);
        el.pause();
        el.volume = this.musicVolume;
        this.mood='chill';
        this.playNextTrack();
      }
    }, stepTime);
  },

  // ---- 合成音效 (Web Audio API 現場合成，無需外部音檔) ----
  tone(freq, startOffset, duration, type, gainPeak){
    const actx = this.ensureCtx(); if(!actx) return;
    const t = actx.currentTime + (startOffset||0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(gainPeak||0.2, t+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+duration);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t); osc.stop(t+duration+0.02);
  },
  noiseClick(startOffset, duration, freq, gainPeak){
    const actx = this.ensureCtx(); if(!actx) return;
    const t = actx.currentTime + (startOffset||0);
    const bufSize = Math.floor(actx.sampleRate*duration);
    const buffer = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/bufSize, 2.2);
    const noise = actx.createBufferSource(); noise.buffer = buffer;
    const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq||1400; bp.Q.value=1.1;
    const gain = actx.createGain();
    gain.gain.setValueAtTime(gainPeak||0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    noise.connect(bp); bp.connect(gain); gain.connect(actx.destination);
    noise.start(t); noise.stop(t+duration+0.01);
  },
  playDiscard(){ if(!this.sfxOn) return; this.noiseClick(0, 0.07, 1500, 0.45); },
  playCall(){ if(!this.sfxOn) return; this.noiseClick(0, 0.05, 900, 0.5); this.noiseClick(0.05, 0.09, 700, 0.4); },
  playRiichi(){ if(!this.sfxOn) return; this.tone(880,0,0.18,'sine',0.18); this.tone(1175,0.1,0.22,'sine',0.18); this.tone(1568,0.2,0.3,'sine',0.2); },
  playTurn(){ if(!this.sfxOn) return; this.tone(660,0,0.1,'sine',0.08); },
  playWin(yakuman){
    if(!this.sfxOn) return;
    const notes = yakuman? [523,659,784,1047,1319,1568] : [523,659,784,1047];
    notes.forEach((f,i)=> this.tone(f, i*0.11, 0.35, 'triangle', 0.22));
  },
  playDraw(){ if(!this.sfxOn) return; this.noiseClick(0, 0.04, 2000, 0.25); }
};

function tileUnicode(t){ return TILE_UNICODE[t.s][t.r-1]; }
const CHINESE_NUM = {1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九'};
function tileLabel(t){
  if(t.s==='z') return HONOR_NAME[t.r];
  const suitName = t.s==='m'?'萬':(t.s==='p'?'筒':'索');
  return CHINESE_NUM[t.r]+suitName;
}
function LT(t){ return `<span class="log-tile">${tileUnicode(t)}</span>`; }
function tileKey(t){ return t.s+t.r; }
function isHonor(t){ return t.s==='z'; }
function isTerminal(t){ return t.s!=='z' && (t.r===1||t.r===9); }
function isTerminalOrHonor(t){ return isHonor(t)||isTerminal(t); }
function sameTile(a,b){ return a.s===b.s && a.r===b.r; }
function sortTiles(arr){ return arr.slice().sort((a,b)=> (SUIT_ORDER[a.s]-SUIT_ORDER[b.s]) || (a.r-b.r)); }

function createWall(){
  const wall=[]; let id=0;
  for(const suit of ['m','p','s']) for(let r=1;r<=9;r++) for(let k=0;k<4;k++) wall.push({s:suit,r,_id:id++});
  for(let r=1;r<=7;r++) for(let k=0;k<4;k++) wall.push({s:'z',r,_id:id++});
  return wall;
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

/* ========================================================================
   牌型分解: 標準型 / 七對子 / 國士無雙
======================================================================== */
function decomposeStandard(tiles){
  const results=[];
  const counts=new Map();
  tiles.forEach(t=>{ const k=tileKey(t); counts.set(k,(counts.get(k)||0)+1); });

  function helper(counts, sets, pairUsed, pairTile){
    let firstKey=null;
    for(const suit of ['m','p','s','z']){
      const max = suit==='z'?7:9;
      for(let r=1;r<=max;r++){ const k=suit+r; if((counts.get(k)||0)>0){ firstKey=k; break; } }
      if(firstKey) break;
    }
    if(!firstKey){ if(pairUsed) results.push({sets:sets.slice(), pair:pairTile}); return; }
    const suit=firstKey[0], rank=parseInt(firstKey.slice(1),10);
    if(!pairUsed && (counts.get(firstKey)||0)>=2){
      const c2=new Map(counts); c2.set(firstKey, c2.get(firstKey)-2);
      helper(c2, sets, true, {s:suit,r:rank});
    }
    if((counts.get(firstKey)||0)>=3){
      const c2=new Map(counts); c2.set(firstKey, c2.get(firstKey)-3);
      sets.push({type:'triplet', tiles:[{s:suit,r:rank},{s:suit,r:rank},{s:suit,r:rank}], concealed:true});
      helper(c2, sets, pairUsed, pairTile); sets.pop();
    }
    if(suit!=='z' && rank<=7){
      const k2=suit+(rank+1), k3=suit+(rank+2);
      if((counts.get(k2)||0)>0 && (counts.get(k3)||0)>0){
        const c2=new Map(counts);
        c2.set(firstKey, c2.get(firstKey)-1); c2.set(k2, c2.get(k2)-1); c2.set(k3, c2.get(k3)-1);
        sets.push({type:'sequence', tiles:[{s:suit,r:rank},{s:suit,r:rank+1},{s:suit,r:rank+2}], concealed:true});
        helper(c2, sets, pairUsed, pairTile); sets.pop();
      }
    }
  }
  helper(counts, [], false, null);
  return results;
}
function isChiitoitsuShape(tiles){
  if(tiles.length!==14) return false;
  const counts=new Map();
  tiles.forEach(t=>{ const k=tileKey(t); counts.set(k,(counts.get(k)||0)+1); });
  if(counts.size!==7) return false;
  for(const v of counts.values()) if(v!==2) return false;
  return true;
}
const KOKUSHI_TYPES = ['m1','m9','p1','p9','s1','s9','z1','z2','z3','z4','z5','z6','z7'];
function isKokushiShape(tiles){
  if(tiles.length!==14) return false;
  const counts=new Map();
  for(const t of tiles){ const k=tileKey(t); if(!KOKUSHI_TYPES.includes(k)) return false; counts.set(k,(counts.get(k)||0)+1); }
  return counts.size>=13;
}
function canWinWith(concealed, melds, extraTile){
  const full = concealed.concat([extraTile]);
  if(melds.length===0 && isKokushiShape(full)) return true;
  if(melds.length===0 && isChiitoitsuShape(full)) return true;
  const decomps = decomposeStandard(full);
  return decomps.length>0 && decomps.some(d=> d.sets.length === (4-melds.length));
}
function isTenpai(concealed, melds){
  for(const suit of ['m','p','s','z']){
    const max = suit==='z'?7:9;
    for(let r=1;r<=max;r++) if(canWinWith(concealed, melds, {s:suit,r})) return true;
  }
  return false;
}
function computeWaits(concealed, melds){
  const waits=[];
  for(const suit of ['m','p','s','z']){
    const max = suit==='z'?7:9;
    for(let r=1;r<=max;r++) if(canWinWith(concealed, melds, {s:suit,r})) waits.push({s:suit,r});
  }
  return waits;
}

/* ========================================================================
   進張數 (シャンテン数) 計算 — 供電腦AI打牌/鳴牌決策使用
======================================================================== */
function shantenStandardRaw(tiles){
  const counts=new Map();
  tiles.forEach(t=>{ const k=tileKey(t); counts.set(k,(counts.get(k)||0)+1); });
  let best=8;
  function rec(counts, sets, taatsu, hasPair){
    let firstKey=null;
    for(const suit of ['m','p','s','z']){
      const max = suit==='z'?7:9;
      for(let r=1;r<=max;r++){ const k=suit+r; if((counts.get(k)||0)>0){ firstKey=k; break; } }
      if(firstKey) break;
    }
    if(!firstKey){
      const effTaatsu = Math.min(taatsu, 4-sets);
      const shanten = 8 - 2*sets - effTaatsu - (hasPair?1:0);
      if(shanten<best) best=shanten;
      return;
    }
    const suit=firstKey[0], rank=parseInt(firstKey.slice(1),10);
    const cnt=counts.get(firstKey);
    if(!hasPair && cnt>=2){ const c2=new Map(counts); c2.set(firstKey,cnt-2); rec(c2,sets,taatsu,true); }
    if(cnt>=3){ const c2=new Map(counts); c2.set(firstKey,cnt-3); rec(c2,sets+1,taatsu,hasPair); }
    if(cnt>=2){ const c2=new Map(counts); c2.set(firstKey,cnt-2); rec(c2,sets,taatsu+1,hasPair); }
    if(suit!=='z' && rank<=7){
      const k2=suit+(rank+1), k3=suit+(rank+2);
      if((counts.get(k2)||0)>0 && (counts.get(k3)||0)>0){
        const c2=new Map(counts); c2.set(firstKey,cnt-1); c2.set(k2,c2.get(k2)-1); c2.set(k3,c2.get(k3)-1);
        rec(c2,sets+1,taatsu,hasPair);
      }
    }
    if(suit!=='z' && rank<=8){
      const k2=suit+(rank+1);
      if((counts.get(k2)||0)>0){ const c2=new Map(counts); c2.set(firstKey,cnt-1); c2.set(k2,c2.get(k2)-1); rec(c2,sets,taatsu+1,hasPair); }
    }
    if(suit!=='z' && rank<=7){
      const k3=suit+(rank+2);
      if((counts.get(k3)||0)>0){ const c2=new Map(counts); c2.set(firstKey,cnt-1); c2.set(k3,c2.get(k3)-1); rec(c2,sets,taatsu+1,hasPair); }
    }
    { const c2=new Map(counts); c2.set(firstKey,cnt-1); rec(c2,sets,taatsu,hasPair); }
  }
  rec(counts,0,0,false);
  return best;
}
function shantenChiitoi(tiles){
  const counts=new Map();
  tiles.forEach(t=>{ const k=tileKey(t); counts.set(k,(counts.get(k)||0)+1); });
  let pairs=0; const kinds=counts.size;
  for(const v of counts.values()) if(v>=2) pairs++;
  return 6 - pairs + Math.max(0, 7-kinds);
}
function shantenKokushi(tiles){
  const counts=new Map();
  let uniq=0, hasPair=false;
  for(const t of tiles){
    const k=tileKey(t);
    if(!KOKUSHI_TYPES.includes(k)) continue;
    const c=(counts.get(k)||0)+1; counts.set(k,c);
    if(c===1) uniq++;
    if(c>=2) hasPair=true;
  }
  return 13 - uniq - (hasPair?1:0);
}
function overallShanten(concealed, meldsCount){
  let s = shantenStandardRaw(concealed) - 2*meldsCount;
  if(meldsCount===0){
    s = Math.min(s, shantenChiitoi(concealed));
    s = Math.min(s, shantenKokushi(concealed));
  }
  return s;
}

/* ========================================================================
   役種與符數判定
======================================================================== */
const YAKUMAN_BASE = 8000;

function meldToSetObj(m){
  if(m.type==='chi') return {type:'sequence', tiles:m.tiles, concealed:false};
  if(m.type==='pon') return {type:'triplet', tiles:m.tiles, concealed:false};
  if(m.type==='ankan') return {type:'triplet', tiles:m.tiles.slice(0,3), concealed:true, isKan:true};
  return {type:'triplet', tiles:m.tiles.slice(0,3), concealed:false, isKan:true}; // minkan / shouminkan
}

function evaluateDecomposition(sets, pair, ctx){
  const fullTiles = sets.flatMap(s=>s.tiles).concat([pair, pair]);
  const yaku=[];
  let yakumanCount=0; const yakumanNames=[];

  const isConcealed = ctx.melds.every(m=>m.type==='ankan');
  const allSequences = sets.every(s=>s.type==='sequence');
  const allTriplets = sets.every(s=>s.type==='triplet');

  let winSet=null, winSetIsPair=false;
  for(const s of sets){ if(s.tiles.some(t=>sameTile(t, ctx.winTile))){ winSet=s; break; } }
  if(!winSet && sameTile(pair, ctx.winTile)) winSetIsPair=true;

  let waitType='ryanmen';
  if(winSetIsPair){ waitType='tanki'; }
  else if(winSet){
    if(winSet.type==='triplet'){ waitType='shanpon'; }
    else{
      const ranks = winSet.tiles.map(t=>t.r).sort((a,b)=>a-b);
      const winR = ctx.winTile.r;
      if(winR===ranks[1]) waitType='kanchan';
      else if(ranks[0]===1 && winR===3) waitType='penchan';
      else if(ranks[2]===9 && winR===7) waitType='penchan';
      else waitType='ryanmen';
    }
  }

  if(ctx.isDoubleRiichi) yaku.push({name:'雙立直',han:2});
  else if(ctx.isRiichi) yaku.push({name:'立直',han:1});
  if(ctx.isRiichi && ctx.isIppatsu) yaku.push({name:'一發',han:1});
  if(ctx.isTsumo && isConcealed) yaku.push({name:'門前清自摸和',han:1});
  if(ctx.isRinshan) yaku.push({name:'嶺上開花',han:1});
  if(ctx.isHaitei) yaku.push({name:'海底摸月',han:1});
  if(ctx.isHoutei) yaku.push({name:'河底撈魚',han:1});
  if(ctx.isChankan) yaku.push({name:'搶槓',han:1});

  const pairIsYakuhai = pair.s==='z' && (pair.r>=5 || pair.r===ctx.seatWind || pair.r===ctx.roundWind);
  const pinfu = isConcealed && allSequences && !pairIsYakuhai && waitType==='ryanmen';
  if(pinfu) yaku.push({name:'平和',han:1});

  if(fullTiles.every(t=>!isTerminalOrHonor(t))) yaku.push({name:'斷幺九',han:1});

  for(const s of sets){
    if(s.type==='triplet' && s.tiles[0].s==='z'){
      const r=s.tiles[0].r;
      if(r>=5) yaku.push({name:'役牌 '+HONOR_NAME[r],han:1});
      if(r===ctx.seatWind) yaku.push({name:'役牌 自風 '+HONOR_NAME[r],han:1});
      if(r===ctx.roundWind) yaku.push({name:'役牌 場風 '+HONOR_NAME[r],han:1});
    }
  }

  if(isConcealed){
    const seqKeys = sets.filter(s=>s.type==='sequence').map(s=>{
      const rs=s.tiles.map(t=>t.r).sort((a,b)=>a-b);
      return s.tiles[0].s+rs.join('');
    });
    const cnt=new Map(); seqKeys.forEach(k=>cnt.set(k,(cnt.get(k)||0)+1));
    let dup=0; for(const v of cnt.values()) dup += Math.floor(v/2);
    if(dup===1) yaku.push({name:'一盃口',han:1});
    else if(dup>=2) yaku.push({name:'二盃口',han:3});
  }

  {
    const seqBySuit={m:new Set(),p:new Set(),s:new Set()};
    sets.filter(s=>s.type==='sequence').forEach(s=>{ const minR=Math.min(...s.tiles.map(t=>t.r)); seqBySuit[s.tiles[0].s].add(minR); });
    let found=false;
    for(let r=1;r<=7;r++) if(seqBySuit.m.has(r)&&seqBySuit.p.has(r)&&seqBySuit.s.has(r)){ found=true; break; }
    if(found) yaku.push({name:'三色同順',han:isConcealed?2:1});
  }
  {
    const triBySuit={m:new Set(),p:new Set(),s:new Set()};
    sets.filter(s=>s.type==='triplet' && s.tiles[0].s!=='z').forEach(s=>triBySuit[s.tiles[0].s].add(s.tiles[0].r));
    let found=false;
    for(let r=1;r<=9;r++) if(triBySuit.m.has(r)&&triBySuit.p.has(r)&&triBySuit.s.has(r)){ found=true; break; }
    if(found) yaku.push({name:'三色同刻',han:2});
  }
  {
    const seqBySuit={m:new Set(),p:new Set(),s:new Set()};
    sets.filter(s=>s.type==='sequence').forEach(s=>{ const minR=Math.min(...s.tiles.map(t=>t.r)); seqBySuit[s.tiles[0].s].add(minR); });
    for(const suit of ['m','p','s']) if(seqBySuit[suit].has(1)&&seqBySuit[suit].has(4)&&seqBySuit[suit].has(7)){ yaku.push({name:'一氣通貫',han:isConcealed?2:1}); break; }
  }
  {
    const allHaveTerminal = sets.every(s=>s.tiles.some(t=>isTerminalOrHonor(t))) && isTerminalOrHonor(pair);
    if(allHaveTerminal){
      const hasHonor = fullTiles.some(t=>t.s==='z');
      if(!hasHonor) yaku.push({name:'純全帯幺九',han:isConcealed?3:2});
      else yaku.push({name:'混全帯幺九',han:isConcealed?2:1});
    }
  }
  if(allTriplets) yaku.push({name:'對對和',han:2});

  let ankouCount=0;
  for(const s of sets){
    if(s.type!=='triplet') continue;
    let concealedForCount = s.concealed;
    const containsWin = s.tiles.some(t=>sameTile(t, ctx.winTile));
    if(containsWin && !ctx.isTsumo && s.concealed && !s.isKan) concealedForCount=false;
    if(concealedForCount) ankouCount++;
  }
  if(ankouCount===4){
    if(winSetIsPair){ yakumanCount+=2; yakumanNames.push('四暗刻單騎(二倍役滿)'); }
    else { yakumanCount+=1; yakumanNames.push('四暗刻'); }
  } else if(ankouCount===3){ yaku.push({name:'三暗刻',han:2}); }

  {
    const suits = new Set(fullTiles.filter(t=>t.s!=='z').map(t=>t.s));
    const hasHonor = fullTiles.some(t=>t.s==='z');
    if(suits.size===1){
      if(hasHonor) yaku.push({name:'混一色',han:isConcealed?3:2});
      else yaku.push({name:'清一色',han:isConcealed?6:5});
    }
  }
  {
    const dragonTriplets = sets.filter(s=>s.type==='triplet' && s.tiles[0].s==='z' && s.tiles[0].r>=5).map(s=>s.tiles[0].r);
    const dragonPair = (pair.s==='z' && pair.r>=5) ? pair.r : null;
    const uniqDragTri = new Set(dragonTriplets);
    if(uniqDragTri.size===3){ yakumanCount+=1; yakumanNames.push('大三元'); }
    else if(uniqDragTri.size===2 && dragonPair && !uniqDragTri.has(dragonPair)) yaku.push({name:'小三元',han:2});
  }
  {
    const windTriplets = sets.filter(s=>s.type==='triplet' && s.tiles[0].s==='z' && s.tiles[0].r<=4).map(s=>s.tiles[0].r);
    const windPair = (pair.s==='z' && pair.r<=4) ? pair.r : null;
    const uniqWindTri = new Set(windTriplets);
    if(uniqWindTri.size===4){ yakumanCount+=2; yakumanNames.push('大四喜(二倍役滿)'); }
    else if(uniqWindTri.size===3 && windPair && !uniqWindTri.has(windPair)){ yakumanCount+=1; yakumanNames.push('小四喜'); }
  }
  if(fullTiles.every(t=>t.s==='z')){ yakumanCount+=1; yakumanNames.push('字一色'); }
  if(fullTiles.every(t=>t.s!=='z' && (t.r===1||t.r===9))){ yakumanCount+=1; yakumanNames.push('清老頭'); }

  if(ctx.melds.length===0){
    const suits = new Set(fullTiles.filter(t=>t.s!=='z').map(t=>t.s));
    const hasHonor = fullTiles.some(t=>t.s==='z');
    if(suits.size===1 && !hasHonor){
      const cnt=new Array(10).fill(0);
      fullTiles.forEach(t=>cnt[t.r]++);
      const base = cnt[1]>=3 && cnt[9]>=3 && [2,3,4,5,6,7,8].every(r=>cnt[r]>=1) && fullTiles.length===14;
      if(base){
        const without = fullTiles.slice();
        const wi = without.findIndex(t=>sameTile(t,ctx.winTile));
        without.splice(wi,1);
        const cnt2=new Array(10).fill(0); without.forEach(t=>cnt2[t.r]++);
        const isPure = cnt2[1]===3 && cnt2[9]===3 && [2,3,4,5,6,7,8].every(r=>cnt2[r]===1);
        if(isPure){ yakumanCount+=2; yakumanNames.push('純正九蓮寶燈(二倍役滿)'); }
        else { yakumanCount+=1; yakumanNames.push('九蓮寶燈'); }
      }
    }
  }
  {
    const greenOK = t=> (t.s==='s' && [2,3,4,6,8].includes(t.r)) || (t.s==='z' && t.r===6);
    if(fullTiles.every(greenOK)){ yakumanCount+=1; yakumanNames.push('綠一色'); }
  }
  {
    const kanCount = ctx.melds.filter(m=>m.type==='ankan'||m.type==='minkan'||m.type==='shouminkan').length;
    if(kanCount===4){ yakumanCount+=1; yakumanNames.push('四槓子'); }
  }

  let fu=20;
  if(isConcealed && !ctx.isTsumo) fu+=10;
  if(ctx.isTsumo && !pinfu) fu+=2;
  for(const s of sets){
    if(s.type!=='triplet') continue;
    const simple = !isTerminalOrHonor(s.tiles[0]);
    let concealedForFu = s.concealed;
    const containsWin = s.tiles.some(t=>sameTile(t, ctx.winTile));
    if(containsWin && !ctx.isTsumo && s.concealed && !s.isKan) concealedForFu=false;
    if(s.isKan) fu += concealedForFu ? (simple?16:32) : (simple?8:16);
    else fu += concealedForFu ? (simple?4:8) : (simple?2:4);
  }
  if(pair.s==='z'){
    if(pair.r>=5) fu+=2;
    if(pair.r===ctx.seatWind) fu+=2;
    if(pair.r===ctx.roundWind) fu+=2;
  }
  if(waitType==='kanchan' || waitType==='penchan' || waitType==='tanki') fu+=2;
  if(fu===20 && !isConcealed) fu=30;
  fu = Math.ceil(fu/10)*10;

  let doraHan=0, doraDetail=[];
  for(const d of ctx.doraTiles){ const c=fullTiles.filter(t=>sameTile(t,d)).length; if(c>0){ doraHan+=c; doraDetail.push({name:'寶牌',han:c}); } }
  if(ctx.isRiichi){
    for(const d of ctx.uraDoraTiles||[]){ const c=fullTiles.filter(t=>sameTile(t,d)).length; if(c>0){ doraHan+=c; doraDetail.push({name:'裏寶牌',han:c}); } }
  }
  let akaHan=0;
  if(ctx.akaCount){ akaHan=ctx.akaCount; doraDetail.push({name:'赤寶牌',han:ctx.akaCount}); }

  if(yakumanCount>0){
    return { yakuman:true, yakumanCount, yakumanNames, han:null, fu:null, score: computeYakumanScore(yakumanCount, ctx.isDealer, ctx.isTsumo) };
  }
  const normalHan = yaku.reduce((a,y)=>a+y.han,0);
  if(normalHan<=0) return null;
  const allYaku = yaku.concat(doraDetail);
  const totalHan = normalHan+doraHan+akaHan;
  return { yakuman:false, yaku:allYaku, han:totalHan, fu, score: computeScore(totalHan, fu, ctx.isDealer, ctx.isTsumo) };
}

function computeYakumanScore(count, isDealer, isTsumo){
  const unit = YAKUMAN_BASE*count;
  if(isTsumo){
    const each = isDealer? unit*2 : unit;
    const dealerPay = isDealer? each : unit*2;
    return { total: isDealer? each*3 : dealerPay+each*2, tsumoEach: isDealer? each:null, tsumoNonDealer: isDealer?null:each, tsumoDealer: isDealer?null:dealerPay, isTsumo:true, isDealer };
  }
  return { total: isDealer? unit*6 : unit*4, isTsumo:false, isDealer };
}
function roundUp100(n){ return Math.ceil(n/100)*100; }
function limitScore(base, isDealer, isTsumo, limitName){
  if(isTsumo){
    if(isDealer){ const each=roundUp100(base*2); return {total:each*3, tsumoEach:each, limitName}; }
    const fromDealer=roundUp100(base*2), fromOthers=roundUp100(base*1);
    return {total: fromDealer+fromOthers*2, tsumoDealer:fromDealer, tsumoNonDealer:fromOthers, limitName};
  }
  const total = roundUp100(base * (isDealer?6:4));
  return {total, limitName};
}
function computeScore(han, fu, isDealer, isTsumo){
  if(han>=13) return computeYakumanScore(Math.floor(han/13)||1, isDealer, isTsumo);
  if(han>=11) return limitScore(6000,isDealer,isTsumo,'三倍滿');
  if(han>=8) return limitScore(4000,isDealer,isTsumo,'倍滿');
  if(han>=6) return limitScore(3000,isDealer,isTsumo,'跳滿');
  if(han===5) return limitScore(2000,isDealer,isTsumo,'滿貫');
  let base = fu * Math.pow(2, 2+han);
  if(base>2000) return limitScore(2000,isDealer,isTsumo,'滿貫');
  return limitScore(base,isDealer,isTsumo,null);
}

function computeBestWin(concealedWithWin, melds, ctx){
  const openSets = melds.map(meldToSetObj);
  if(melds.length===0 && isKokushiShape(concealedWithWin)){
    const without = concealedWithWin.slice();
    const wi = without.findIndex(t=>sameTile(t, ctx.winTile));
    without.splice(wi,1);
    const set13 = new Set(without.map(tileKey));
    const isThirteenWait = set13.size===13 && without.length===13;
    const count = isThirteenWait?2:1;
    return { yakuman:true, yakumanCount:count, yakumanNames:[isThirteenWait?'國士無雙十三面(二倍役滿)':'國士無雙'], han:null, fu:null, score: computeYakumanScore(count, ctx.isDealer, ctx.isTsumo) };
  }
  if(melds.length===0 && isChiitoitsuShape(concealedWithWin)){
    const counts=new Map();
    concealedWithWin.forEach(t=>{const k=tileKey(t);counts.set(k,(counts.get(k)||0)+1);});
    const fullTiles = concealedWithWin;
    const yaku=[{name:'七對子',han:2}];
    if(ctx.isDoubleRiichi) yaku.push({name:'雙立直',han:2});
    else if(ctx.isRiichi) yaku.push({name:'立直',han:1});
    if(ctx.isRiichi && ctx.isIppatsu) yaku.push({name:'一發',han:1});
    if(ctx.isTsumo) yaku.push({name:'門前清自摸和',han:1});
    if(ctx.isHaitei) yaku.push({name:'海底摸月',han:1});
    if(ctx.isHoutei) yaku.push({name:'河底撈魚',han:1});
    if(fullTiles.every(t=>!isTerminalOrHonor(t))) yaku.push({name:'斷幺九',han:1});
    const suits=new Set(fullTiles.filter(t=>t.s!=='z').map(t=>t.s));
    const hasHonor=fullTiles.some(t=>t.s==='z');
    if(suits.size===1){ if(hasHonor) yaku.push({name:'混一色',han:3}); else yaku.push({name:'清一色',han:6}); }
    let doraHan=0;
    for(const d of ctx.doraTiles){ const c=fullTiles.filter(t=>sameTile(t,d)).length; if(c>0){ doraHan+=c; yaku.push({name:'寶牌',han:c}); } }
    if(ctx.isRiichi) for(const d of ctx.uraDoraTiles||[]){ const c=fullTiles.filter(t=>sameTile(t,d)).length; if(c>0){ doraHan+=c; yaku.push({name:'裏寶牌',han:c}); } }
    if(ctx.akaCount) yaku.push({name:'赤寶牌',han:ctx.akaCount});
    const totalHan = yaku.reduce((a,y)=>a+y.han,0) + (ctx.akaCount||0) - (ctx.akaCount||0); // akaCount already counted once above; guard double count
    const finalHan = yaku.reduce((a,y)=>a+y.han,0);
    const fu=25;
    return { yakuman:false, yaku, han:finalHan, fu, score: computeScore(finalHan, fu, ctx.isDealer, ctx.isTsumo) };
  }
  const needSets = 4-melds.length;
  const decomps = decomposeStandard(concealedWithWin);
  let best=null;
  for(const d of decomps){
    if(d.sets.length!==needSets) continue;
    const allSets = openSets.concat(d.sets);
    const result = evaluateDecomposition(allSets, d.pair, ctx);
    if(!result) continue;
    const val = result.yakuman ? (result.yakumanCount*1e9) : (result.han*1000+result.fu);
    if(!best || val > best._val){ best = result; best._val = val; }
  }
  return best;
}

const PLAYER_NAMES = ['你','電腦A','電腦B','電腦C'];
const JP_SURNAMES = ['工藤','佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','佐々木','山口','松本','井上','木村','林','斎藤','清水','森','池田','橋本','山崎','石川','中島','前田','藤田','岡田'];
const JP_GIVEN_MALE = ['直樹','翔太','大輔','健太','拓也','和也','智也','裕太','雄一','浩二','誠','剛','大介','健二','秀樹','俊介','亮太','達也','光一','慎太郎','悠斗','蓮'];
const JP_GIVEN_FEMALE = ['美咲','葵','愛','由美','恵子','直美','真央','陽菜','結衣','花子','千尋','桜','沙織','麻衣','舞','彩香','美穂','咲良','紗希','智子','裕子'];
const JP_GIVEN = JP_GIVEN_MALE.concat(JP_GIVEN_FEMALE);
function randomJPName(exclude){
  let name;
  let guard=0;
  do{
    const s = JP_SURNAMES[Math.floor(Math.random()*JP_SURNAMES.length)];
    const g = JP_GIVEN[Math.floor(Math.random()*JP_GIVEN.length)];
    name = s+g;
    guard++;
  } while(exclude.includes(name) && guard<30);
  return name;
}
function generateAiNames(){
  const names=[];
  for(let i=0;i<3;i++) names.push(randomJPName(names));
  return names;
}
var G = null;

function newGame(){
  const keepDifficulty = (typeof G!=='undefined' && G && G.difficulty) ? G.difficulty : 'normal';
  G = { scores:[25000,25000,25000,25000], dealerIndex:0, kyoku:1, honba:0, roundWind:1, gameOver:false, difficulty: keepDifficulty, aiNames: generateAiNames() };
  startHand();
}

function startHand(){
  const wall = shuffle(createWall());
  const deadWall = wall.splice(0,14);
  const players=[];
  for(let i=0;i<4;i++){
    const hand = sortTiles(wall.splice(0, i===G.dealerIndex?14:13));
    players.push({
      idx:i, name: i===0?'你':G.aiNames[i-1], hand, melds:[], discards:[], discardCount:0,
      riichi:false, riichiTurn:-1, tempFuriten:false,
      isHuman:i===0, seatWind:((i-G.dealerIndex+4)%4)+1,
      ippatsuActive:false, justDrew:(i===G.dealerIndex)?hand[hand.length-1]:null,
      paoFrom:null
    });
  }
  G.wall=wall; G.deadWall=deadWall;
  G.rinshanUsed=0;
  G.doraRevealCount=1;
  G.omoteIndicators=[deadWall[0],deadWall[1],deadWall[2],deadWall[3],deadWall[4]];
  G.uraIndicators=[deadWall[5],deadWall[6],deadWall[7],deadWall[8],deadWall[9]];
  G.rinshanTiles=[deadWall[10],deadWall[11],deadWall[12],deadWall[13]];
  G.players=players;
  G.currentPlayer=G.dealerIndex;
  G.turnCount=0;
  G.lastDiscard=null; G.lastDiscarderIdx=null;
  G.phase='draw';
  G.gameLog=[];
  G.anyCallHappened=false;
  G.selectedTileIdx=null;
  G.riichiDeclareArmed=false;
  G.humanReactionOptions=null;

  log(`====== ${WIND_NAME[G.roundWind]}${G.kyoku}局 ${G.honba}本場 開始，莊家：${players[G.dealerIndex].name} ======`);
  AudioSys.updateMood();
  renderAll();
  processCurrentTurnStart(true);
}

function log(msg){
  G.gameLog.push(msg);
  if(G.gameLog.length>200) G.gameLog.shift();
  const el=document.getElementById('centerLog');
  if(el){ el.innerHTML=G.gameLog.map(m=>`<div>${m}</div>`).join(''); el.scrollTop=el.scrollHeight; }
}

function currentDoraTiles(){
  return G.omoteIndicators.slice(0,G.doraRevealCount).map(ind=>{
    if(ind.s==='z'){ if(ind.r<=4) return {s:'z', r: ind.r%4+1}; return {s:'z', r: ((ind.r-5+1)%3)+5}; }
    return {s:ind.s, r: ind.r%9+1};
  });
}
function currentUraDoraTiles(){
  return G.uraIndicators.slice(0,G.doraRevealCount).map(ind=>{
    if(ind.s==='z'){ if(ind.r<=4) return {s:'z', r: ind.r%4+1}; return {s:'z', r: ((ind.r-5+1)%3)+5}; }
    return {s:ind.s, r: ind.r%9+1};
  });
}

/* ---------------- 回合流程 ---------------- */
function processCurrentTurnStart(alreadyHasDrawnTile){
  const p=G.players[G.currentPlayer];
  let isHaitei=false;
  if(!alreadyHasDrawnTile){
    if(G.wall.length===0) return resolveExhaustiveDraw();
    const t=G.wall.pop();
    isHaitei = (G.wall.length===0);
    p.hand = sortTiles(p.hand);
    p.hand.push(t);
    p.justDrew=t;
    if(p.isHuman) AudioSys.playDraw();
  } else {
    p.hand = sortTiles(p.hand);
  }

  const winResult = tryEvaluateWin(p, p.justDrew, true, false, {isHaitei});
  p._winResult = winResult;
  p._isHaitei = isHaitei;
  G.phase = p.isHuman ? 'humanDiscard' : 'aiDiscard';

  if(p.isHuman && p.justDrew){
    if(winResult){
      log(`<span style="color:#8fe0a0;">（判定：摸到 ${LT(p.justDrew)}（${tileLabel(p.justDrew)}）可以自摸，${winResult.yakuman? '役滿 '+winResult.yakumanNames.join('・') : winResult.han+'翻'+winResult.fu+'符'}）</span>`);
    } else {
      const shapeOnly = canWinWith(p.hand.filter(t=>!(t===p.justDrew)), p.melds, p.justDrew);
      if(shapeOnly){
        log(`<span style="color:#ff8a4c;">（判定：摸到 ${LT(p.justDrew)}（${tileLabel(p.justDrew)}）牌型湊得成，但沒有役，不能自摸）</span>`);
      }
    }
  }

  // 本次自摸判定已使用目前的一發旗標；此次摸牌後，一發的窗口即結束(無論是否和了)
  if(p.riichi) p.ippatsuActive=false;

  renderAll();
  if(p.isHuman) return;
  setTimeout(()=>aiTakeTurn(p), 500);
}

function tryEvaluateWin(p, winTile, isTsumo, isRinshan, extra){
  extra = extra || {};
  if(!isTsumo && p.tempFuriten) return null;
  const ctx = {
    winTile, isTsumo,
    isRiichi: p.riichi,
    isDoubleRiichi: p.riichi && p.riichiTurn===0 && p._doubleRiichiEligible,
    isIppatsu: p.riichi && p.ippatsuActive,
    isRinshan, isHaitei: !!extra.isHaitei, isHoutei: !!extra.isHoutei, isChankan: !!extra.isChankan,
    seatWind: p.seatWind, roundWind: G.roundWind, isDealer: p.idx===G.dealerIndex,
    melds: p.melds, doraTiles: currentDoraTiles(), uraDoraTiles: currentUraDoraTiles(), akaCount:0
  };
  const concealedWithWin = isTsumo ? p.hand.slice() : p.hand.concat([winTile]);
  const result = computeBestWin(concealedWithWin, p.melds, ctx);
  return result;
}

function isPlayerFuriten(p){
  if(p.tempFuriten) return true;
  const waits = computeWaits(p.hand, p.melds);
  if(waits.length===0) return false;
  return p.discards.some(d=> waits.some(w=>sameTile(w,d)));
}

/* ---------------- 人類操作 ---------------- */
function humanDeclareTsumo(){
  const p=G.players[0];
  if(!p._winResult) return;
  finishHandWithWin(0, p._winResult, true, null, {isHaitei:p._isHaitei});
}
function humanSelectTile(idx){ if(G.phase!=='humanDiscard') return; G.selectedTileIdx=(G.selectedTileIdx===idx)?null:idx; renderAll(); }

function humanDeclareRiichi(){
  const p=G.players[0];
  if(p.melds.length>0){ alert('已副露，無法立直'); return; }
  if(G.scores[0] < 1000){ alert('點數不足，無法立直'); return; }
  if(G.wall.length<4){ alert('牌山剩餘不足，無法立直'); return; }
  G.riichiDeclareArmed=true; renderAll();
}

function humanDiscardTile(idx){
  const p=G.players[0];
  if(G.riichiDeclareArmed){
    const testHand=p.hand.slice(); testHand.splice(idx,1);
    if(!isTenpai(testHand, p.melds)){ alert('打出這張牌無法聽牌，請選別張或取消立直'); return; }
  }
  const tile=p.hand[idx];
  p.hand.splice(idx,1);
  p.hand = sortTiles(p.hand);
  p.discards.push(tile);
  p.discardCount++;
  p.justDrew=null;
  G.selectedTileIdx=null;
  p.tempFuriten=false;

  const riichiJustDeclared = G.riichiDeclareArmed;
  if(G.riichiDeclareArmed){
    p._doubleRiichiEligible = (p.discardCount===1 && !G.anyCallHappened);
    p.riichi=true; p.riichiTurn=0;
    G.scores[0]-=1000;
    G.riichiDeclareArmed=false;
    p.ippatsuActive=true;
    log(p._doubleRiichiEligible? `你 宣告雙立直！` : `你 宣告立直！`);
    AudioSys.updateMood();
  }

  log(`你 打出 ${LT(tile)}`);
  if(riichiJustDeclared) AudioSys.playRiichi(); else AudioSys.playDiscard();
  G.lastDiscard=tile; G.lastDiscarderIdx=0;
  renderAll();
  handleDiscardReactions();
}

function humanCanRiichiNow(){
  const p=G.players[0];
  if(p.riichi || p.melds.length>0) return false;
  if(G.scores[0]<1000) return false;
  if(G.wall.length<4) return false;
  for(let i=0;i<p.hand.length;i++){
    const testHand=p.hand.slice(); testHand.splice(i,1);
    if(isTenpai(testHand, p.melds)) return true;
  }
  return false;
}
function humanAnkanOptions(){
  const p=G.players[0]; const counts=new Map();
  p.hand.forEach(t=>{const k=tileKey(t); counts.set(k,(counts.get(k)||0)+1);});
  const opts=[];
  for(const [k,v] of counts) if(v===4) opts.push({s:k[0], r:parseInt(k.slice(1))});
  return opts;
}
function humanShouminkanOptions(){
  const p=G.players[0]; const opts=[];
  p.melds.forEach((m,mi)=>{ if(m.type==='pon'){ const has=p.hand.some(t=>sameTile(t,m.tiles[0])); if(has) opts.push({meldIdx:mi, tile:m.tiles[0]}); } });
  return opts;
}
function humanDoAnkan(tileSpec){
  const p=G.players[0];
  const taken=p.hand.filter(t=>sameTile(t,tileSpec)).slice(0,4);
  p.hand=p.hand.filter(t=>!sameTile(t,tileSpec));
  p.melds.push({type:'ankan', tiles:taken});
  log(`你 暗槓 ${LT(tileSpec)}`);
  AudioSys.playCall();
  checkPaoForMeld(p, {type:'ankan',tiles:taken}, null);
  revealKanDora();
  doKanReplacement(p, null);
}
function humanDoShouminkan(opt){
  const p=G.players[0];
  const meld=p.melds[opt.meldIdx];
  const hi=p.hand.findIndex(t=>sameTile(t, meld.tiles[0]));
  const tile=p.hand.splice(hi,1)[0];
  const others=[];
  for(const other of G.players){ if(other.idx===p.idx) continue; if(isPlayerFuriten(other)) continue; const r=tryEvaluateWin(other, tile, false, false, {isChankan:true}); if(r) others.push({other,result:r}); }
  if(others.length>0){
    p.hand.push(tile); // 還原
    others.forEach(o=> finishHandWithWin(o.other.idx, o.result, false, p.idx, {isChankan:true}));
    return;
  }
  meld.type='shouminkan'; meld.tiles.push(tile);
  log(`你 加槓 ${LT(tile)}`);
  AudioSys.playCall();
  checkPaoForMeld(p, meld, null);
  revealKanDora();
  doKanReplacement(p, null);
}
function revealKanDora(){ if(G.doraRevealCount<5) G.doraRevealCount++; }
function doKanReplacement(p, fromDiscarderIdx){
  if(G.rinshanUsed>=4 || G.rinshanTiles.length<=G.rinshanUsed){ G.phase= p.isHuman?'humanDiscard':'aiDiscard'; p.hand=sortTiles(p.hand); renderAll(); if(!p.isHuman) setTimeout(()=>aiDiscardAfterDraw(p),500); return; }
  const t=G.rinshanTiles[G.rinshanUsed]; G.rinshanUsed++;
  p.hand = sortTiles(p.hand);
  p.hand.push(t); p.justDrew=t;
  const winResult=tryEvaluateWin(p, t, true, true, {});
  p._winResult=winResult; p._isHaitei=false;
  G.phase = p.isHuman?'humanDiscard':'aiDiscard';
  renderAll();
  if(!p.isHuman) setTimeout(()=>aiTakeTurn(p), 500);
}

/* ---------------- 出牌後反應 (優先權: 榮和 > 碰/槓 > 吃) ---------------- */
// 即時診斷：每次有人打牌，只要那張牌理論上湊得成你的和牌型，
// 就直接在紀錄裡寫清楚「有沒有讓你榮和、沒有的話是什麼原因」，不用事後用分析工具回想。
function logHumanRonDiagnostics(discard, discarderIdx, isHoutei){
  if(discarderIdx===0) return; // 不能榮自己打的牌
  const human = G.players[0];
  if(!canWinWith(human.hand, human.melds, discard)) return; // 跟這張牌型上完全無關，不用提示
  const furiten = isPlayerFuriten(human);
  if(furiten){
    log(`<span style="color:#ff8a4c;">（提示：${LT(discard)}（${tileLabel(discard)}）本來湊得成你的和牌型，但你目前振聽中，所以不能榮和）</span>`);
    return;
  }
  const result = tryEvaluateWin(human, discard, false, false, {isHoutei});
  if(!result){
    log(`<span style="color:#ff8a4c;">（提示：${LT(discard)}（${tileLabel(discard)}）湊得成牌型，但沒有役，所以不能榮和）</span>`);
  }
  // 若 result 存在且未振聽，代表等一下就會正常跳出榮和選項，不需要額外提示
}

function handleDiscardReactions(){
  const discard=G.lastDiscard, discarderIdx=G.lastDiscarderIdx;
  G.phase='reaction';
  const isHoutei = G.wall.length===0;

  logHumanRonDiagnostics(discard, discarderIdx, isHoutei);

  const ronners=[];
  for(let i=0;i<4;i++){
    if(i===discarderIdx) continue;
    const p=G.players[i];
    if(isPlayerFuriten(p)) continue;
    const result = tryEvaluateWin(p, discard, false, false, {isHoutei});
    if(result) ronners.push({p,result});
  }

  const humanRonner = ronners.find(r=>r.p.idx===0);
  const aiRonners = ronners.filter(r=>r.p.idx!==0);

  if(humanRonner){
    G.phase='humanReaction';
    G.humanReactionOptions = { canRon:true, canPon:false, canKan:false, canChi:false, discard, discarderIdx, pendingAiRonners:aiRonners, isHoutei };
    renderAll();
    return;
  }
  if(aiRonners.length>0){
    aiRonners.forEach(r=> finishHandWithWin(r.p.idx, r.result, false, discarderIdx, {isHoutei}));
    return;
  }

  // 檢查鳴牌機會 (碰/槓 > 吃)，AI與人類都有機會，數學上同一張牌不會同時有兩人可碰/槓
  for(let i=0;i<4;i++){
    if(i===discarderIdx) continue;
    const p=G.players[i];
    const cIn = countInHand(p.hand, discard);
    const canPon = cIn>=2;
    const canKan = cIn>=3;
    const canChi = ((discarderIdx+1)%4===i) && chiOptions(p.hand, discard).length>0;
    if(!canPon && !canKan && !canChi) continue;
    if(p.isHuman){
      G.humanReactionOptions = { canRon:false, canPon, canKan, canChi, discard, discarderIdx, isHoutei };
      G.phase='humanReaction';
      renderAll();
      return;
    } else {
      const decision = aiDecideCall(p, discard, canPon, canKan, canChi, discarderIdx);
      if(decision){
        executeAiCall(p, decision, discard, discarderIdx);
        return;
      }
    }
  }
  advanceAfterNoReaction();
}
function countInHand(hand, tile){ return hand.filter(t=>sameTile(t,tile)).length; }
function chiOptions(hand, tile){
  if(tile.s==='z') return [];
  const has = r=> hand.some(t=>t.s===tile.s && t.r===r);
  const opts=[];
  if(tile.r>=3 && has(tile.r-1) && has(tile.r-2)) opts.push([tile.r-2,tile.r-1]);
  if(tile.r>=2 && tile.r<=8 && has(tile.r-1) && has(tile.r+1)) opts.push([tile.r-1,tile.r+1]);
  if(tile.r<=7 && has(tile.r+1) && has(tile.r+2)) opts.push([tile.r+1,tile.r+2]);
  return opts;
}
function humanPassReaction(){
  const opt=G.humanReactionOptions;
  const wasRon = opt && opt.canRon;
  const pendingAi = opt ? opt.pendingAiRonners : null;
  G.humanReactionOptions=null;
  if(wasRon){ G.players[0].tempFuriten=true; }
  if(pendingAi && pendingAi.length>0){
    pendingAi.forEach(r=> finishHandWithWin(r.p.idx, r.result, false, G.lastDiscarderIdx, {isHoutei:opt.isHoutei}));
    return;
  }
  // 若剛才是ron選項被跳過，需要接著檢查碰/吃/槓機會
  if(wasRon){
    const discard=G.lastDiscard, discarderIdx=G.lastDiscarderIdx;
    for(let i=0;i<4;i++){
      if(i===discarderIdx) continue;
      const p=G.players[i];
      const cIn=countInHand(p.hand, discard);
      const canPon=cIn>=2, canKan=cIn>=3;
      const canChi=((discarderIdx+1)%4===i) && chiOptions(p.hand, discard).length>0;
      if(!canPon && !canKan && !canChi) continue;
      if(p.isHuman){ G.humanReactionOptions={canRon:false,canPon,canKan,canChi,discard,discarderIdx}; G.phase='humanReaction'; renderAll(); return; }
      const decision=aiDecideCall(p, discard, canPon, canKan, canChi, discarderIdx);
      if(decision){ executeAiCall(p, decision, discard, discarderIdx); return; }
    }
    advanceAfterNoReaction();
    return;
  }
  advanceAfterNoReaction();
}
function humanDoRon(){
  const p=G.players[0];
  const opt=G.humanReactionOptions;
  const result = tryEvaluateWin(p, G.lastDiscard, false, false, {isHoutei:opt?opt.isHoutei:false});
  finishHandWithWin(0, result, false, G.lastDiscarderIdx, {isHoutei:opt?opt.isHoutei:false});
}
function humanDoPon(){
  const p=G.players[0]; const discard=G.lastDiscard;
  const taken=removeNOf(p, discard, 2);

}
function humanDoKanCall(){

function humanDoChi(chosenPair){
  const p=G.players[0]; const discard=G.lastDiscard;
  const t1i=p.hand.findIndex(t=>t.s===discard.s && t.r===chosenPair[0]); const t1=p.hand.splice(t1i,1)[0];
  const t2i=p.hand.findIndex(t=>t.s===discard.s && t.r===chosenPair[1]); const t2=p.hand.splice(t2i,1)[0];
  const tiles=sortTiles([t1,t2,discard]);

  AudioSys.playCall();
  G.currentPlayer=0; clearIppatsuAll();
  G.phase='humanDiscard'; G.humanReactionOptions=null;
  renderAll();
}
function removeNOf(p, tile, n){
  const idxs=[]; p.hand.forEach((t,i)=>{ if(sameTile(t,tile)) idxs.push(i); });
  const takeIdxs=idxs.slice(0,n);
  const taken=takeIdxs.map(i=>p.hand[i]);
  p.hand = p.hand.filter((t,i)=>!takeIdxs.includes(i));
  return taken;
}
function removeLastDiscardFromDiscarder(){ G.players[G.lastDiscarderIdx].discards.pop(); }
function clearIppatsuAll(){ G.players.forEach(p=>p.ippatsuActive=false); }

function checkPaoForMeld(p, meld, fromDiscarderIdx){
  if(fromDiscarderIdx===null || fromDiscarderIdx===undefined) return;
  if(meld.type!=='pon' && meld.type!=='minkan') return;
  const tile = meld.tiles[0];
  if(tile.s!=='z') return;
  if(tile.r>=5){
    const dragonMelds = p.melds.filter(m=>(m.type==='pon'||m.type==='minkan'||m.type==='ankan'||m.type==='shouminkan') && m.tiles[0].s==='z' && m.tiles[0].r>=5);
    const uniq = new Set(dragonMelds.map(m=>m.tiles[0].r));
    if(uniq.size===3){ p.paoFrom = fromDiscarderIdx; }
  } else {
    const windMelds = p.melds.filter(m=>(m.type==='pon'||m.type==='minkan'||m.type==='ankan'||m.type==='shouminkan') && m.tiles[0].s==='z' && m.tiles[0].r<=4);
    const uniq = new Set(windMelds.map(m=>m.tiles[0].r));
    if(uniq.size===4){ p.paoFrom = fromDiscarderIdx; }
  }
}

function advanceAfterNoReaction(){
  G.humanReactionOptions=null;
  const nextIdx=(G.lastDiscarderIdx+1)%4;
  G.currentPlayer=nextIdx; G.turnCount++;
  processCurrentTurnStart(false);
}

/* ---------------- AI 邏輯 ---------------- */
function aiTakeTurn(p){
  if(p._winResult){ finishHandWithWin(p.idx, p._winResult, true, null, {isHaitei:p._isHaitei}); return; }
  // AI 暗槓 / 加槓 (立直後不再考慮，避免違規風險)
  if(!p.riichi){
    const counts=new Map(); p.hand.forEach(t=>{const k=tileKey(t); counts.set(k,(counts.get(k)||0)+1);});
    for(const [k,v] of counts){
      if(v===4){
        const tileSpec={s:k[0], r:parseInt(k.slice(1))};
        const taken=p.hand.filter(t=>sameTile(t,tileSpec));
        p.hand=p.hand.filter(t=>!sameTile(t,tileSpec));
        p.melds.push({type:'ankan', tiles:taken});
        log(`${p.name} 暗槓 ${LT(tileSpec)}`);
        AudioSys.playCall();
        checkPaoForMeld(p, {type:'ankan',tiles:taken}, null);
        revealKanDora();
        doKanReplacement(p, null);
        return;
      }
    }
    for(let mi=0; mi<p.melds.length; mi++){
      const m=p.melds[mi];
      if(m.type==='pon'){
        const hi=p.hand.findIndex(t=>sameTile(t,m.tiles[0]));
        if(hi>=0){
          const tile=p.hand[hi];
          const others=[];
          for(const other of G.players){ if(other.idx===p.idx) continue; if(isPlayerFuriten(other)) continue; const r=tryEvaluateWin(other, tile, false, false, {isChankan:true}); if(r) others.push({other,result:r}); }
          if(others.length>0){ others.forEach(o=> finishHandWithWin(o.other.idx, o.result, false, p.idx, {isChankan:true})); return; }
          p.hand.splice(hi,1);
          m.type='shouminkan'; m.tiles.push(tile);
          log(`${p.name} 加槓 ${LT(tile)}`);
          AudioSys.playCall();
          checkPaoForMeld(p, m, null);
          revealKanDora();
          doKanReplacement(p, null);
          return;
        }
      }
    }
  }
  aiDiscardAfterDraw(p);
}
function aiCanRiichiNow(p){
  if(p.riichi || p.melds.length>0) return false;
  if(G.scores[p.idx]<1000) return false;
  if(G.wall.length<4) return false;
  for(let i=0;i<p.hand.length;i++){
    const testHand=p.hand.slice(); testHand.splice(i,1);
    if(isTenpai(testHand, p.melds)) return true;
  }
  return false;
}
function aiDiscardAfterDraw(p){
  let tile=null, riichiDeclare=false;
  if(aiCanRiichiNow(p)){
    // 在所有能維持聽牌的選擇中，挑shanten評分函式認為最好的那張
    let bestT=null, bestScore=-Infinity;
    for(let i=0;i<p.hand.length;i++){
      const testHand=p.hand.slice(); testHand.splice(i,1);
      if(!isTenpai(testHand, p.melds)) continue;
      const t=p.hand[i];
      let score=0;
      if(t.s==='z' && (t.r===p.seatWind||t.r===G.roundWind||t.r>=5)) score-=3;
      if(!bestT || score>bestScore){ bestT=t; bestScore=score; }
    }
    if(bestT){ tile=bestT; riichiDeclare=true; }
  }
  if(!tile) tile = aiChooseDiscard(p);
  const idx = p.hand.findIndex(t=>sameTile(t,tile));
  p.hand.splice(idx,1);
  p.hand = sortTiles(p.hand);
  p.discards.push(tile); p.discardCount++;
  p.justDrew=null;
  p.tempFuriten=false;
  if(riichiDeclare){
    p._doubleRiichiEligible = (p.discardCount===1 && !G.anyCallHappened);
    p.riichi=true; p.riichiTurn=0;
    G.scores[p.idx]-=1000;
    p.ippatsuActive=true;
    log(p._doubleRiichiEligible? `${p.name} 宣告雙立直！` : `${p.name} 宣告立直！`);
    AudioSys.updateMood();
  }
  log(`${p.name} 打出 ${LT(tile)}`);
  if(riichiDeclare) AudioSys.playRiichi(); else AudioSys.playDiscard();
  G.lastDiscard=tile; G.lastDiscarderIdx=p.idx;
  renderAll();
  handleDiscardReactions();
}
/* ---- 輔助: 計算某張牌在場面上已經可見幾張(自己手牌+所有棄牌+所有副露+寶牌指示牌) ---- */
function countVisibleCopies(tile, selfPlayer){
  let c=0;
  // 只計入「公開資訊」：所有人的棄牌、所有人已經副露(攤在桌上)的牌、寶牌指示牌
  // 絕對不能去看任何人「蓋著」的手牌內容——除了發起詢問的AI自己的手牌(這是它自己合法擁有的資訊)
  G.players.forEach(pl=>{
    pl.discards.forEach(t=>{ if(sameTile(t,tile)) c++; });
    pl.melds.forEach(m=> m.tiles.forEach(t=>{ if(sameTile(t,tile)) c++; }));
  });
  if(selfPlayer) c += selfPlayer.hand.filter(t=>sameTile(t,tile)).length;
  G.omoteIndicators.slice(0,G.doraRevealCount).forEach(t=>{ if(sameTile(t,tile)) c++; });
  return c;
}
/* ---- 輔助: 某張牌對某個危險玩家的安全分數(越高越安全) ---- */
function tileSafetyAgainst(tile, dp, selfPlayer){
  if(dp.discards.some(d=>sameTile(d,tile))) return 100; // 現物，振聽保證安全
  let s = 0;
  if(tile.s!=='z'){
    const r=tile.r;
    if(r-3>=1 && dp.discards.some(d=>d.s===tile.s && d.r===r-3)) s=Math.max(s,40); // 筋
    if(r+3<=9 && dp.discards.some(d=>d.s===tile.s && d.r===r+3)) s=Math.max(s,40);
    if(r===1||r===9) s=Math.max(s,10);
  } else {
    const visible = countVisibleCopies(tile, selfPlayer);
    if(visible>=3) s=Math.max(s,90);
    else if(visible===2) s=Math.max(s,20);
  }
  return s;
}
function computeSafety(tile, dangerousPlayers, selfPlayer){
  if(dangerousPlayers.length===0) return 0;
  let minS = Infinity;
  dangerousPlayers.forEach(dp=>{ const s=tileSafetyAgainst(tile,dp,selfPlayer); if(s<minS) minS=s; });
  return minS;
}
/* ---- 輔助: 這張牌對「牌效率+役種價值」的加減分(普通/困難共用) ---- */
function tileValueBonus(p, tile, restHand){
  let v = 0;
  const dora = currentDoraTiles();
  const isDora = dora.some(d=>sameTile(d,tile));
  if(isDora) v += 15; // 寶牌盡量留
  if(tile.s==='z'){
    if(tile.r===p.seatWind || tile.r===G.roundWind || tile.r>=5){
      const cnt = restHand.filter(o=>sameTile(o,tile)).length;
      if(cnt===0) v -= 5;
    } else {
      const cnt = restHand.filter(o=>sameTile(o,tile)).length;
      if(cnt===0) v += 8;
    }
  } else if(isTerminal(tile)){
    const cnt = restHand.filter(o=>sameTile(o,tile)).length;
    if(cnt===0) v += 2;
    // 斷幺九傾向：如果手牌大多已經是中張，孤立的么九牌優先打出
    const hasHonor = p.hand.some(t=>t.s==='z');
    if(!hasHonor && cnt===0) v += 3;
  }
  return v;
}

function aiChooseDiscard(p){
  const diff = G.difficulty || 'normal';
  if(diff==='easy') return aiChooseDiscardCore(p, false, false);
  if(diff==='normal') return aiChooseDiscardCore(p, true, false);
  return aiChooseDiscardCore(p, true, true);
}

function aiChooseDiscardCore(p, valueAware, defenseAware){
  const hand=p.hand;
  const dangerousPlayers = defenseAware ? G.players.filter(o=>o.idx!==p.idx && (o.riichi || o.melds.length>=2)) : [];
  const myShanten = overallShanten(hand, p.melds.length);
  // 只有在「危險且自己手牌還很遠(shanten>=2)」時才轉為保守摺牌模式；已經聽牌/一向聽時照常進攻
  const foldMode = defenseAware && dangerousPlayers.length>0 && myShanten>=2;

  let best=null, bestShanten=Infinity, bestScore=-Infinity, bestSafety=-Infinity;
  for(let i=0;i<hand.length;i++){
    const rest = hand.slice(0,i).concat(hand.slice(i+1));
    const sh = overallShanten(rest, p.melds.length);
    const t=hand[i];
    let score;
    if(valueAware) score = tileValueBonus(p, t, rest);
    else {
      score=0;
      if(t.s==='z'){
        if(t.r===p.seatWind || t.r===G.roundWind || t.r>=5){ if(rest.filter(o=>sameTile(o,t)).length===0) score-=5; }
        else { if(rest.filter(o=>sameTile(o,t)).length===0) score+=8; }
      } else if(isTerminal(t)){ if(rest.filter(o=>sameTile(o,t)).length===0) score+=2; }
    }
    const safety = dangerousPlayers.length>0 ? computeSafety(t, dangerousPlayers, p) : 0;

    if(foldMode){
      // 保守模式：安全分數優先，shanten/value只當第二層tie-break
      if(!best || safety>bestSafety || (safety===bestSafety && score>bestScore)){
        best=t; bestSafety=safety; bestScore=score; bestShanten=sh;
      }
    } else {
      // 進攻模式：shanten優先，同shanten時用value分數，危險時再用安全分數當細部tie-break
      const combinedScore = score + safety*3;
      if(!best || sh<bestShanten || (sh===bestShanten && combinedScore>bestScore)){
        best=t; bestShanten=sh; bestScore=combinedScore; bestSafety=safety;
      }
    }
  }
  return best || hand[0];
}
function aiIsYakuhaiTile(p, tile){ return tile.s==='z' && (tile.r>=5 || tile.r===p.seatWind || tile.r===G.roundWind); }
function aiDecideCall(p, discard, canPon, canKan, canChi, discarderIdx){
  const beforeShanten = overallShanten(p.hand, p.melds.length);
  if(canKan){
    const taken = p.hand.filter(t=>sameTile(t,discard));
    const restHand = p.hand.filter(t=>!sameTile(t,discard));
    const afterShanten = overallShanten(restHand, p.melds.length+1);
    if(afterShanten <= beforeShanten && (aiIsYakuhaiTile(p,discard) || afterShanten<beforeShanten)) return {type:'kan'};
  }
  if(canPon){
    const restHand = removeNOfSim(p.hand, discard, 2);
    const afterShanten = overallShanten(restHand, p.melds.length+1);
    if(aiIsYakuhaiTile(p, discard) && afterShanten<=beforeShanten) return {type:'pon'};
    if(afterShanten < beforeShanten) return {type:'pon'};
  }
  if(canChi){
    const opts = chiOptions(p.hand, discard);
    let bestOpt=null, bestSh=Infinity;
    for(const opt of opts){
      const restHand = p.hand.slice();
      for(const r of opt){ const hi=restHand.findIndex(t=>t.s===discard.s && t.r===r); restHand.splice(hi,1); }
      const afterShanten = overallShanten(restHand, p.melds.length+1);
      if(afterShanten<bestSh){ bestSh=afterShanten; bestOpt=opt; }
    }
    if(bestOpt && bestSh < beforeShanten) return {type:'chi', pair:bestOpt};
  }
  return null;
}
function removeNOfSim(hand, tile, n){
  const idxs=[]; hand.forEach((t,i)=>{ if(sameTile(t,tile)) idxs.push(i); });
  const takeIdxs = idxs.slice(0,n);
  return hand.filter((t,i)=>!takeIdxs.includes(i));
}
function executeAiCall(p, decision, discard, discarderIdx){
  G.anyCallHappened=true;
  if(decision.type==='kan'){
    const taken=removeNOf(p, discard, 3);
    p.melds.push({type:'minkan', tiles:[taken[0],taken[1],taken[2],discard], from:discarderIdx, calledTileId:discard._id});
    checkPaoForMeld(p, p.melds[p.melds.length-1], discarderIdx);
    removeLastDiscardFromDiscarder();
    log(`${p.name} 大明槓 ${LT(discard)}`);
    AudioSys.playCall();
    G.currentPlayer=p.idx; clearIppatsuAll();
    revealKanDora();
    doKanReplacement(p, discarderIdx);
  } else if(decision.type==='pon'){
    const taken=removeNOf(p, discard, 2);
    p.melds.push({type:'pon', tiles:[taken[0],taken[1],discard], from:discarderIdx, calledTileId:discard._id});
    checkPaoForMeld(p, p.melds[p.melds.length-1], discarderIdx);
    removeLastDiscardFromDiscarder();
    log(`${p.name} 碰了 ${LT(discard)}`);
    AudioSys.playCall();
    G.currentPlayer=p.idx; clearIppatsuAll();
    setTimeout(()=>aiDiscardAfterDraw(p), 500);
  } else if(decision.type==='chi'){
    const t1i=p.hand.findIndex(t=>t.s===discard.s && t.r===decision.pair[0]); const t1=p.hand.splice(t1i,1)[0];
    const t2i=p.hand.findIndex(t=>t.s===discard.s && t.r===decision.pair[1]); const t2=p.hand.splice(t2i,1)[0];
    const tiles=sortTiles([t1,t2,discard]);
    p.melds.push({type:'chi', tiles, from:discarderIdx, calledTileId:discard._id});
    removeLastDiscardFromDiscarder();
    log(`${p.name} 吃了 ${LT(discard)}`);
    AudioSys.playCall();
    G.currentPlayer=p.idx; clearIppatsuAll();
    setTimeout(()=>aiDiscardAfterDraw(p), 500);
  }
  renderAll();
}

function playTsumoFlash(){

function finishHandWithWin(winnerIdx, result, isTsumo, loserIdx, extra){
  extra=extra||{};
  G.phase='hand-over';
  AudioSys.playWin(result.yakuman);
  AudioSys.playVictory();
  const winner=G.players[winnerIdx];
  const isDealer=winnerIdx===G.dealerIndex;
  let payments=[];
  let scoreTotalDisplay=0;
  const paoIdx = (result.yakumanNames && (result.yakumanNames.includes('大三元')||result.yakumanNames.includes('大四喜(二倍役滿)')||result.yakumanNames.includes('小四喜'))) ? winner.paoFrom : null;

  const sc = result.score;
  if(paoIdx!==null && paoIdx!==undefined && paoIdx!==winnerIdx){
    const pay = sc.total + G.honba*300;
    payments.push({idx:paoIdx, delta:-pay});
    payments.push({idx:winnerIdx, delta:pay});
    scoreTotalDisplay=pay;
  } else if(isTsumo){
    G.players.forEach((p,i)=>{
      if(i===winnerIdx) return;
      const pay = isDealer? sc.tsumoEach : (i===G.dealerIndex? sc.tsumoDealer : sc.tsumoNonDealer);
      payments.push({idx:i, delta:-(pay+G.honba*100)});
    });
    const totalGain = payments.reduce((a,x)=>a-x.delta,0);
    payments.push({idx:winnerIdx, delta:totalGain});
    scoreTotalDisplay=totalGain;
  } else {
    const pay = sc.total + G.honba*300;
    payments.push({idx:loserIdx, delta:-pay});
    payments.push({idx:winnerIdx, delta:pay});
    scoreTotalDisplay=pay;
  }
  payments.forEach(pm=>{ G.scores[pm.idx]+=pm.delta; });

  const winTileDisplay = isTsumo? winner.justDrew : G.lastDiscard;

  const resultInfo = {
    type: extra.isChankan? '搶槓': (isTsumo? '自摸':'榮和'),
    winnerName: winner.name,
    loserName: isTsumo? null : G.players[loserIdx].name,
    paoName: (paoIdx!==null && paoIdx!==undefined)? G.players[paoIdx].name : null,
    result, scoreTotalDisplay, winTile: winTileDisplay, hand: winner.hand, melds: winner.melds
  };
  if(isTsumo && winnerIdx===0){
    playTsumoFlash();
    setTimeout(()=>showResultModal(resultInfo), 550);
  } else {
    showResultModal(resultInfo);
  }

  log(`<span class="win-line">${winner.name} ${extra.isChankan?'搶槓':(isTsumo?'自摸':'榮和 ('+G.players[loserIdx].name+')')} 和了！`+
      (result.yakuman? `役滿 ${result.yakumanNames.join('・')}` : `${result.han}翻${result.fu}符`)+` 得 ${scoreTotalDisplay}點</span>`);

  const dealerWon = isDealer;
  const busted = G.scores.some(s=>s<0);
  const gameEndsNow = advanceRoundAfterHand(dealerWon) || busted;
  G._pendingGameOver = gameEndsNow;
}

function advanceRoundAfterHand(dealerWon){
  if(dealerWon){ G.honba++; return false; }
  G.dealerIndex=(G.dealerIndex+1)%4; G.kyoku++; G.honba=0;
  if(G.kyoku>4){
    if(G.roundWind===1){ G.roundWind=2; G.kyoku=1; }
    else { return true; }
  }
  return false;
}

function resolveExhaustiveDraw(){
  G.phase='hand-over';
  const tenpaiList = G.players.map(p=>isTenpai(p.hand, p.melds));
  const tenpaiCount = tenpaiList.filter(Boolean).length;
  if(tenpaiCount>0 && tenpaiCount<4){
    const gain=3000/tenpaiCount, lose=3000/(4-tenpaiCount);
    G.players.forEach((p,i)=>{ if(tenpaiList[i]) G.scores[i]+=Math.round(gain); else G.scores[i]-=Math.round(lose); });
  }
  log(`流局(荒牌)。聽牌者：${G.players.filter((p,i)=>tenpaiList[i]).map(p=>p.name).join('、')||'無'}`);
  showDrawModal(tenpaiList, tenpaiCount);
  const dealerTenpai = tenpaiList[G.dealerIndex];
  const busted = G.scores.some(s=>s<0);
  const gameEndsNow = advanceRoundAfterHand(dealerTenpai) || busted;
  G._pendingGameOver = gameEndsNow;
}

function toggleReactionMinimize(e){

function makeDraggable(panel, handle){
  let dragging=false, offsetX=0, offsetY=0;
  handle.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.reaction-min-btn')) return;
    dragging=true;
    const rect = panel.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    panel.style.left = rect.left+'px';
    panel.style.top = rect.top+'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.transform = 'none'; // 拖曳開始後解除預設置中的transform，改用絕對座標定位
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  });
  handle.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    let x = e.clientX - offsetX;
    let y = e.clientY - offsetY;
    x = Math.max(4, Math.min(window.innerWidth - panel.offsetWidth - 4, x));
    y = Math.max(4, Math.min(window.innerHeight - panel.offsetHeight - 4, y));
    panel.style.left = x+'px';
    panel.style.top = y+'px';
  });
  handle.addEventListener('pointerup', ()=>{ dragging=false; });
  handle.addEventListener('pointercancel', ()=>{ dragging=false; });
}

function describeResult(result){
  if(!result) return {label:'無役（不能和）', detail:''};
  if(result.yakuman){
    return {label:`役滿：${result.yakumanNames.join('・')}`, detail:`${result.score.total}點`};
  }
  const yakuStr = result.yaku.map(y=>`${y.name}${y.han}翻`).join('、');
  return {label:`${result.han}翻${result.fu}符 (${result.score.total}點)`, detail:yakuStr};
}

function analyzeTenpai(){
  if(!G || !G.players){ return; }
  const p = G.players[0];
  const concealed = p.hand.slice();
  const melds = p.melds;
  const doraTiles = currentDoraTiles();
  const uraDoraTiles = currentUraDoraTiles();
  const furiten = isPlayerFuriten(p);

  const baseCtx = {
    isRiichi: p.riichi,
    isDoubleRiichi: !!(p.riichi && p._doubleRiichiEligible),
    isIppatsu: !!(p.riichi && p.ippatsuActive),
    isRinshan:false, isHaitei:false, isHoutei:false, isChankan:false,
    seatWind: p.seatWind, roundWind: G.roundWind, isDealer: p.idx===G.dealerIndex,
    melds, doraTiles, uraDoraTiles: p.riichi ? uraDoraTiles : []
  };

  const waitTiles = [];
  for(const suit of ['m','p','s','z']){
    const max = suit==='z'?7:9;
    for(let r=1;r<=max;r++){
      const t={s:suit,r};
      if(canWinWith(concealed, melds, t)) waitTiles.push(t);
    }
  }

  const rows = waitTiles.map(w=>{
    const withWin = concealed.concat([w]);
    const tsumoCtx = Object.assign({}, baseCtx, {winTile:w, isTsumo:true});
    const ronCtx = Object.assign({}, baseCtx, {winTile:w, isTsumo:false});
    const tsumoResult = computeBestWin(withWin, melds, tsumoCtx);
    const ronResult = computeBestWin(withWin, melds, ronCtx);
    return {tile:w, tsumoResult, ronResult};
  });

  const shanten = overallShanten(concealed, melds.length);

  showTenpaiModal({p, concealed, melds, rows, furiten, shanten});
}

  if(panel.style.display==='block'){ panel.style.display='none'; return; }
  panel.innerHTML = `
  <h3>本遊戲涵蓋的正式規則</h3>
  <div>
  東風＋南風全半莊戰(東1～南4)、四人對局(你+3家電腦，電腦會吃／碰／槓)、標準/七對子/國士無雙三種和牌型、
  完整役種(含役滿與雙倍役滿：國士無雙十三面聽、四暗刻單騎、大四喜、純正九蓮寶燈等)、
  完整符數計算(各種待ち加符)、寶牌與立直專用的裏寶牌、暗槓／大明槓／加槓與嶺上開花、搶槓、
  海底摸月／河底撈魚、立直棒與本場、振聽(含同巡振聽)判定使你不會誤榮和、
  大三元／大四喜／小四喜的「包(責任払い)」規則(由造成第3組龍牌刻子或第4組風牌刻子的放槍者全額負擔)、
  流局聽牌罰符、大戶(飛び／點數為負)立即結束對局。
  </div>
  <h3>仍未完整實作、屬於AI強度而非規則的部分</h3>
  <div>
  電腦的吃／碰／槓與棄牌選擇是以「進張數(シャンテン数)」簡化估算來決策，不是頂尖打法(不會刻意防守放槍、不會讀牌看穿他家聽牌)。除此之外的計番、計符、和牌判定均依正式規則實作。
  </div>
  `;
  panel.style.display='block';
};

}

function showYakuListModal(){
  const root=document.getElementById('modalRoot');
  const body = YAKU_TABLE.map(sec=>`
    <div style="margin-top:12px;">
      <div style="color:var(--gold-bright);font-family:sans-serif;font-weight:700;font-size:14px;margin-bottom:6px;border-bottom:1px solid rgba(201,168,106,.3);padding-bottom:3px;">${sec.cat}</div>
      ${sec.items.map(([name,desc])=>`<div style="display:flex;gap:10px;padding:4px 0;font-family:sans-serif;font-size:13px;"><b style="color:#f0e6c8;min-width:104px;">${name}</b><span style="color:#a9bdb0;">${desc}</span></div>`).join('')}
    </div>`).join('');
  root.innerHTML = `<div class="modal-overlay"><div class="modal" style="max-width:560px;max-height:82vh;">
    <h2>📖 役種表</h2>
    <div style="text-align:left;max-height:60vh;overflow-y:auto;padding-right:6px;">${body}</div>
    <div class="modal-actions"><button class="act" onclick="closeModal();">關閉</button></div>
  </div></div>`;
}

function openSettingsModal(){
  const root=document.getElementById('modalRoot');
  const diffLabel = {easy:'簡單', normal:'普通', hard:'困難'};
  root.innerHTML = `
  <div class="modal-overlay"><div class="modal" style="max-width:380px;">
    <h2>⚙️ 設定</h2>
    <div class="settings-row">
      <button class="audio-btn${AudioSys.musicOn?'':' off'}" onclick="handleMusicToggle()">🎵 音樂：${AudioSys.musicOn?'開':'關'}</button>
      <input type="range" min="0" max="1" step="0.05" value="${AudioSys.musicVolume}" oninput="AudioSys.setVolume(parseFloat(this.value))" style="accent-color:var(--gold-bright);width:100px;">
    </div>
    <div class="settings-row">
      <button class="audio-btn${AudioSys.sfxOn?'':' off'}" onclick="handleSfxToggle()">🔔 音效：${AudioSys.sfxOn?'開':'關'}</button>
    </div>
    <div class="settings-row" style="margin-top:16px;border-top:1px solid rgba(201,168,106,.25);padding-top:14px;">
      <span style="color:#cfd8d2;font-size:13px;">電腦難度：</span>
      ${['easy','normal','hard'].map(d=>`<button class="audio-btn diff-btn${(G&&G.difficulty===d)?' active':''}" onclick="setDifficulty('${d}')">${diffLabel[d]}</button>`).join('')}
    </div>
    <div class="modal-actions"><button class="act" onclick="closeModal();">關閉</button></div>
  </div></div>`;
}
function handleMusicToggle(){ AudioSys.toggleMusic(); openSettingsModal(); }
function handleSfxToggle(){ AudioSys.toggleSfx(); openSettingsModal(); }
function setDifficulty(d){
  G.difficulty = d;
  const diffLabel = {easy:'簡單', normal:'普通', hard:'困難'};
  log(`（電腦難度已切換為：${diffLabel[d]}，下一次電腦出牌就會套用新難度）`);
  openSettingsModal();
}
